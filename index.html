<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JSON-tehtävä</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <style>
        .navbar-oma {
            background-color: #0f5c5c;
        }

        .navbar-oma .navbar-brand,
        .navbar-oma .nav-link {
            color: #f3f7f6;
        }

        .navbar-oma .nav-link:hover,
        .navbar-oma .nav-link.active {
            color: #ffd166;
        }

        body {
            background-color: #f3f7f6;
        }

        h1,
        h2 {
            color: #0f5c5c;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-oma navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="index.html">JSON-tehtävä</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#valikko"
                aria-controls="valikko" aria-expanded="false" aria-label="Avaa valikko">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="valikko">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Etusivu</a></li>
                    <li class="nav-item"><a class="nav-link" href="tietue.json">Tietue</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1>JSON-datan käsittelyä</h1>
        <p class="lead">Harjoitellaan JSON-tiedoston hakemista Fetch API:lla.</p>
        <div id="vastaus"></div>
    </main>

    <script>
        fetch("tietue.json")
            .then(function (response) {
                return response.json();
            })
            .then(function (responseJson) {
                kerro(responseJson);
            })
            .catch(function (error) {
                document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
            });

        function kerro(data) {
            let html = "";
            html += "<h2>" + data.otsikko + "</h2>";
            html += '<img src="' + data.kuva + '" alt="Kuva" class="img-fluid mb-3" style="max-height: 300px; object-fit: cover;">';

            html += "<h3>Taulukon sisältö</h3><ul>";
            for (let i = 0; i < data.taulukko.length; i++) {
                html += "<li>" + i + ": " + data.taulukko[i] + "</li>";
            }
            html += "</ul>";

            html += "<h3>Sisäkkäinen taulukko</h3><ul>";
            for (let i = 0; i < data.sisakkainenTaulukko.length; i++) {
                html += "<li>" + data.sisakkainenTaulukko[i].join(", ") + "</li>";
            }
            html += "</ul>";

            document.getElementById("vastaus").innerHTML = html;
        }
    </script>
</body>

</html>
